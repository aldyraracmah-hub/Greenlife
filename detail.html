<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail Kegiatan – GreenLife</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-mist text-soil font-body">
<header class="bg-forest text-white shadow">
  <nav class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3" aria-label="Navigasi utama">
    <a href="index.html#beranda" class="font-display text-2xl font-extrabold">🌱 GreenLife</a>
    <a href="index.html#kegiatan" class="hover:text-marigold">&larr; Semua kegiatan</a>
  </nav>
</header>

<main class="max-w-5xl mx-auto px-4 py-10">
  <article id="detail" class="bg-white rounded-xl shadow overflow-hidden md:grid md:grid-cols-2">
    <figure class="bg-forest/10 flex items-center justify-center">
      <img id="dImg" src="" alt="" class="w-full max-h-[80vh] object-contain">
    </figure>
    <div class="p-6 md:p-8">
      <span id="dCat" class="text-xs font-semibold bg-forest text-white px-2 py-1 rounded-full"></span>
      <h1 id="dTitle" class="font-display text-2xl md:text-3xl font-extrabold mt-3"></h1>
      <dl class="mt-3 text-sm space-y-1">
        <div class="flex gap-2"><dt class="font-semibold">Tanggal:</dt><dd id="dDate"></dd></div>
        <div class="flex gap-2"><dt class="font-semibold">Lokasi:</dt><dd id="dPlace"></dd></div>
      </dl>
      <div id="dText" class="mt-5 space-y-3"></div>
      <h2 class="font-bold text-lg mt-6">Manfaat kegiatan</h2>
      <ul id="dBenefits" class="list-disc pl-5 mt-2 space-y-1"></ul>
      <a id="dSource" href="#" target="_blank" rel="noopener" class="hidden mt-6 text-moss font-semibold hover:underline"></a>
    </div>
  </article>
  <nav class="flex justify-between mt-6 text-sm font-semibold" aria-label="Kegiatan lainnya">
    <a id="prevLink" href="#" class="text-moss hover:underline"></a>
    <a id="nextLink" href="#" class="text-moss hover:underline"></a>
  </nav>
</main>

<footer class="bg-soil text-white text-center text-xs py-4">&copy; 2026 GreenLife. Proyek UTS Pemrograman Web.</footer>
<script src="data.js"></script>
<script src="detail.js"></script>
</body>
</html>
